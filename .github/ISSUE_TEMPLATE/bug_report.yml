name: Bug report
description: Report a reproducible SDK defect without sensitive data
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, tokens, private repository content or exploit details. Security vulnerabilities must follow SECURITY.md.
  - type: input
    id: version
    attributes:
      label: SDK version
      placeholder: "0.2.0"
    validations:
      required: true
  - type: dropdown
    id: python
    attributes:
      label: Python version
      options: ["3.11", "3.12", "3.13", "3.14", "Other"]
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Describe the result without including secrets or personal data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use synthetic inputs and copy-safe commands.
      render: shell
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact and limitations
      description: Explain scope, operational impact and known constraints.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Safety confirmation
      options:
        - label: I removed credentials, tokens, private data and proprietary material.
          required: true
        - label: This is not a vulnerability disclosure requiring SECURITY.md.
          required: true

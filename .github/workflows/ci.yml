name: Continuous Integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Full-history secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan current and historical content
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_VERSION: "8.30.1"

  sbom:
    name: CycloneDX SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate deterministic CycloneDX SBOM
        run: bash tools/generate_sbom.sh artifacts/bonfim-sdk.cdx.json
      - name: Preserve CycloneDX SBOM
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: bonfim-sdk-cyclonedx-${{ github.run_id }}-${{ github.run_attempt }}.json
          path: artifacts/bonfim-sdk.cdx.json
          if-no-files-found: error
          retention-days: 30

  bqa:
    name: Governance baseline evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - name: Validate quality baseline
        run: python tools/bqa_verify.py --mode baseline --output artifacts/bqa-evidence.json
      - name: Validate release baseline
        run: python tools/bre_verify.py --mode baseline --output artifacts/bre-evidence.json
      - name: Preserve governance evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: governance-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/bqa-evidence.json
            artifacts/bre-evidence.json
          if-no-files-found: error
          retention-days: 30

  test:
    name: Tests — Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Compile source
        run: python -m compileall -q src examples tests tools
      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  quality:
    name: Coverage, typing and static security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned development tools
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Enforce coverage threshold
        run: python -m coverage run -m unittest discover -s tests -v && python -m coverage report --fail-under=90
      - name: Lint
        run: python -m ruff check src tests examples tools
      - name: Type check
        run: python -m mypy -p bonfim
      - name: Deterministic formatting gate
        run: python tools/format_verify.py --output artifacts/format-evidence.json
      - name: Runtime license gate
        run: python tools/license_verify.py --output artifacts/license-evidence.json
      - name: Registry performance regression baseline
        run: python tools/performance_baseline.py --output artifacts/performance-evidence.json
      - name: SAST
        run: python -m bandit -r src -q -lll -iii
      - name: Preserve quality evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: quality-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/format-evidence.json
            artifacts/license-evidence.json
            artifacts/performance-evidence.json
          if-no-files-found: error
          retention-days: 30

  package:
    name: Build, install and verify package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned build tools
        run: python -m pip install --disable-pip-version-check build==1.3.0 twine==6.2.0
      - name: Build source and wheel distributions
        run: python -m build
      - name: Validate package metadata
        run: python -m twine check dist/*
      - name: Verify package contents and metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import email
          import zipfile

          wheel = next(Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
              metadata_name = next(name for name in names if name.endswith(".dist-info/METADATA"))
              metadata = email.message_from_bytes(archive.read(metadata_name))
          required_suffixes = ("LICENSE", "NOTICE", "py.typed")
          missing = [suffix for suffix in required_suffixes if not any(name.endswith(suffix) for name in names)]
          if missing:
              raise SystemExit(f"wheel is missing required files: {missing}")
          if metadata.get("License-Expression") != "Apache-2.0":
              raise SystemExit("wheel metadata does not declare Apache-2.0")
          if metadata.get("Requires-Python") != ">=3.11":
              raise SystemExit("wheel metadata has unexpected Requires-Python")
          PY
      - name: Generate SHA-256 distribution checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Generate build provenance attestation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Install wheel in a clean virtual environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/bonfim-sdk-smoke
          /tmp/bonfim-sdk-smoke/bin/python -m pip install --disable-pip-version-check --no-deps dist/*.whl
          /tmp/bonfim-sdk-smoke/bin/bonfim version
          /tmp/bonfim-sdk-smoke/bin/bonfim doctor
          /tmp/bonfim-sdk-smoke/bin/python - <<'PY'
          from pathlib import Path
          import bonfim
          from importlib import resources

          expected_version = Path("VERSION").read_text(encoding="utf-8").strip()
          assert bonfim.__version__ == expected_version
          assert resources.files("bonfim").joinpath("py.typed").is_file()
          assert resources.files("bonfim.templates").joinpath("skill.py.tpl").is_file()
          PY
      - name: Preserve distributions and integrity evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: bonfim-sdk-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

name: Release Candidate Validation

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact branch, tag or commit to validate
        required: true
        default: main
        type: string
      expected_version:
        description: Expected Semantic Version without a leading v
        required: true
        default: 0.2.1
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: release-candidate-${{ inputs.source_ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Release candidate preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact source ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Validate requested version against source
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import pathlib
          import re
          import tomllib

          expected = os.environ["EXPECTED_VERSION"].strip()
          if not re.fullmatch(r"(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:[-+][0-9A-Za-z.-]+)?", expected):
              raise SystemExit("expected_version is not a supported Semantic Version string")

          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          package_version = project["project"]["version"]
          version_file = pathlib.Path("VERSION").read_text(encoding="utf-8").strip()
          source = pathlib.Path("src/bonfim/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'^__version__\s*=\s*["\']([^"\']+)["\']', source, re.MULTILINE)
          if match is None:
              raise SystemExit("could not read bonfim.__version__ from source")
          source_version = match.group(1)

          observed = {package_version, version_file, source_version}
          if observed != {expected}:
              raise SystemExit(
                  "version mismatch: "
                  f"requested={expected}, pyproject={package_version}, "
                  f"VERSION={version_file}, source={source_version}"
              )

          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          if f"## [{expected}]" not in changelog:
              raise SystemExit(f"CHANGELOG.md does not contain version {expected}")
          if not pathlib.Path(f"release/notes/v{expected}.md").is_file():
              raise SystemExit(f"release notes are missing for {expected}")

          print(f"validated release candidate version {expected}")
          PY

  tests:
    name: Candidate tests — Python ${{ matrix.python }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout exact source ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Configure Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Compile and test
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python -m compileall -q src examples tests tools
          python -m unittest discover -s tests -v

  assurance:
    name: Candidate assurance, packaging and provenance
    needs: [preflight, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source ref with full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pinned verification tools
        run: python -m pip install --disable-pip-version-check -e '.[dev]'

      - name: Enforce coverage threshold
        run: |
          set -euo pipefail
          python -m coverage run -m unittest discover -s tests -v
          python -m coverage report --fail-under=90

      - name: Lint, type check and SAST
        run: |
          set -euo pipefail
          python -m ruff check src tests examples tools
          python -m mypy -p bonfim
          python -m bandit -r src -q -lll -iii

      - name: Enforce deterministic formatting policy
        run: python tools/format_verify.py --output dist/format-evidence.json

      - name: Enforce runtime license policy
        run: python tools/license_verify.py --output dist/license-evidence.json

      - name: Enforce registry performance regression baseline
        run: python tools/performance_baseline.py --output dist/performance-evidence.json

      - name: Full-history secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_VERSION: "8.30.1"

      - name: Build source and wheel distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*.whl dist/*.tar.gz

      - name: Verify package contents and metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import email
          import zipfile

          wheel = next(Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
              metadata_name = next(name for name in names if name.endswith(".dist-info/METADATA"))
              metadata = email.message_from_bytes(archive.read(metadata_name))

          required_suffixes = ("LICENSE", "NOTICE", "py.typed")
          missing = [suffix for suffix in required_suffixes if not any(name.endswith(suffix) for name in names)]
          if missing:
              raise SystemExit(f"wheel is missing required files: {missing}")
          if metadata.get("License-Expression") != "Apache-2.0":
              raise SystemExit("wheel metadata does not declare Apache-2.0")
          if metadata.get("Requires-Python") != ">=3.11":
              raise SystemExit("wheel metadata has unexpected Requires-Python")
          PY

      - name: Install wheel in clean environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/bonfim-sdk-release-candidate
          /tmp/bonfim-sdk-release-candidate/bin/python -m pip install --disable-pip-version-check --no-deps dist/*.whl
          /tmp/bonfim-sdk-release-candidate/bin/bonfim version
          /tmp/bonfim-sdk-release-candidate/bin/bonfim doctor
          /tmp/bonfim-sdk-release-candidate/bin/python - <<'PY'
          import bonfim
          from importlib import resources

          assert resources.files("bonfim").joinpath("py.typed").is_file()
          assert resources.files("bonfim.templates").joinpath("skill.py.tpl").is_file()
          print(bonfim.__version__)
          PY

      - name: Generate deterministic CycloneDX SBOM
        run: bash tools/generate_sbom.sh dist/bonfim-sdk.cdx.json

      - name: Preserve frozen release notes
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          cp "release/notes/v${version}.md" dist/RELEASE_NOTES.md

      - name: Validate BQA candidate readiness
        run: python tools/bqa_verify.py --mode candidate --output dist/bqa-candidate-evidence.json

      - name: Generate candidate evidence manifest
        run: python tools/candidate_evidence.py --output dist/candidate-evidence.json

      - name: Generate preliminary SHA-256 checksums for BRE validation
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.whl *.tar.gz *.json RELEASE_NOTES.md > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Validate BRE candidate readiness
        run: python tools/bre_verify.py --mode candidate --output dist/bre-candidate-evidence.json

      - name: Generate and verify final candidate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.whl *.tar.gz *.json RELEASE_NOTES.md > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Generate build provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Preserve validated candidate artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: bonfim-sdk-release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

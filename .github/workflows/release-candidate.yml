name: Release Candidate Validation

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact branch, tag or commit to validate
        required: true
        default: main
        type: string
      expected_version:
        description: Expected Semantic Version without a leading v
        required: true
        default: 0.2.1
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: release-candidate-${{ inputs.source_ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate non-publishing release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Validate requested version against source
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import pathlib
          import re
          import tomllib

          expected = os.environ["EXPECTED_VERSION"].strip()
          if not re.fullmatch(r"0|[1-9]\d*\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:[-+][0-9A-Za-z.-]+)?", expected):
              raise SystemExit("expected_version is not a supported Semantic Version string")

          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          package_version = project["project"]["version"]
          source = pathlib.Path("src/bonfim/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'^__version__\s*=\s*["\']([^"\']+)["\']', source, re.MULTILINE)
          if match is None:
              raise SystemExit("could not read bonfim.__version__ from source")
          source_version = match.group(1)

          if expected != package_version or expected != source_version:
              raise SystemExit(
                  f"version mismatch: requested={expected}, pyproject={package_version}, source={source_version}"
              )
          print(f"validated version {expected}")
          PY

      - name: Install pinned verification tools
        run: python -m pip install --disable-pip-version-check -e '.[dev]'

      - name: Compile, test and enforce coverage
        run: |
          set -euo pipefail
          python -m compileall -q src examples tests
          python -m coverage run -m unittest discover -s tests -v
          python -m coverage report --fail-under=90

      - name: Lint, type check and SAST
        run: |
          set -euo pipefail
          python -m ruff check src tests examples
          python -m mypy -p bonfim
          python -m bandit -r src -q -lll -iii

      - name: Full-history secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_VERSION: "8.30.1"

      - name: Build source and wheel distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Generate and verify SHA-256 checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Install wheel in clean environment
        run: |
          set -euo pipefail
          python -m venv /tmp/bonfim-sdk-release-candidate
          /tmp/bonfim-sdk-release-candidate/bin/python -m pip install --disable-pip-version-check --no-deps dist/*.whl
          /tmp/bonfim-sdk-release-candidate/bin/bonfim version
          /tmp/bonfim-sdk-release-candidate/bin/bonfim doctor
          /tmp/bonfim-sdk-release-candidate/bin/python - <<'PY'
          import bonfim
          from importlib import resources

          assert resources.files("bonfim").joinpath("py.typed").is_file()
          assert resources.files("bonfim.templates").joinpath("skill.py.tpl").is_file()
          print(bonfim.__version__)
          PY

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/bonfim-sdk.cdx.json
          upload-artifact: false
          dependency-snapshot: false
          syft-version: v1.48.0

      - name: Generate build provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Preserve validated candidate artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bonfim-sdk-release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
